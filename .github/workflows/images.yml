name: images
# Build, reproduce, publish, sign and verify the agl-ci builder + runner images.
# PRs: build twice + compare only (no push, no signing, no id-token).
on:
  pull_request:
    paths: [docker/**, policy/**, scripts/**, .github/workflows/images.yml]
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 3 * * 1'   # weekly reproducibility canary
  workflow_dispatch:
    inputs:
      build_fail_on:
        description: 'Override policy/cve.env BUILD_FAIL_ON (none|low|medium|high|critical)'
        required: false

permissions: {}

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository }}   # ghcr.io/<owner>/<repo>/{builder,runner}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml  # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax; revisit on actionlint bump
    permissions: { contents: read }

  builder:
    needs: lint
    name: builder (${{ matrix.n }})
    strategy: { fail-fast: false, matrix: { n: [a, b] } }
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: echo "digest=$(scripts/build-image.sh builder builder.tar)" > digest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "builder-${{ matrix.n }}", path: "builder.tar\ndigest.txt", retention-days: 7 }

  builder-compare:
    needs: builder
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs: { digest: "${{ steps.cmp.outputs.digest }}" }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'builder-*', path: art }
      - id: cmp
        run: |
          a=$(sed 's/^digest=//' art/builder-a/digest.txt); b=$(sed 's/^digest=//' art/builder-b/digest.txt)
          echo "a=$a b=$b"; [ "$a" = "$b" ] || { echo "::error::builder is not reproducible"; exit 1; }
          echo "digest=$a" >> "$GITHUB_OUTPUT"

  runner:
    name: runner (${{ matrix.n }})
    needs: builder-compare
    strategy: { fail-fast: false, matrix: { n: [a, b] } }
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: builder-a, path: art }
      - run: echo "digest=$(scripts/build-image.sh runner runner.tar art/builder.tar)" > digest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "runner-${{ matrix.n }}", path: "runner.tar\ndigest.txt", retention-days: 7 }

  runner-compare:
    needs: runner
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs: { digest: "${{ steps.cmp.outputs.digest }}" }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'runner-*', path: art }
      - id: cmp
        run: |
          a=$(sed 's/^digest=//' art/runner-a/digest.txt); b=$(sed 's/^digest=//' art/runner-b/digest.txt)
          echo "a=$a b=$b"; [ "$a" = "$b" ] || { echo "::error::runner is not reproducible"; exit 1; }
          echo "digest=$a" >> "$GITHUB_OUTPUT"

  scan:
    name: cve scan (build bar)
    needs: [builder-compare, runner-compare]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: builder-a, path: art/builder }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: runner-a, path: art/runner }
      - name: install grype (sha256-pinned)
        run: |
          . docker/pins.env
          curl -fsSL -o g.tgz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  g.tgz" | sha256sum -c -
          sudo tar -xzf g.tgz -C /usr/local/bin grype
      - name: scan (report always, fail only at the bar)
        env: { FAIL_ON: "${{ inputs.build_fail_on }}" }
        run: |
          rc=0
          for img in builder runner; do
            scripts/cve-scan.sh "oci-archive:art/$img/$img.tar" build "report/$img" || rc=1
            { echo "## $img"; cat "report/$img/cve-build.md"; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $rc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: cve-build-report, path: report, retention-days: 90 }

  smoke:
    name: smoke (start the images)
    needs: [builder-compare, runner-compare]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: builder-a, path: art/builder }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: runner-a, path: art/runner }
      - run: |
          scripts/smoke-image.sh builder art/builder/builder.tar
          scripts/smoke-image.sh runner art/runner/runner.tar

  publish:
    name: publish + sign
    if: github.event_name != 'pull_request'
    needs: [builder-compare, runner-compare, scan, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign
    outputs:
      builder: ${{ steps.push.outputs.builder }}
      runner: ${{ steps.push.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: tag
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) t="${GITHUB_REF#refs/tags/v}"
              ref="repos/$GITHUB_REPOSITORY/git/ref/tags/${GITHUB_REF#refs/tags/}"
              [ "$(gh api "$ref" --jq .object.type)" = tag ] || { echo "::error::release tag must be annotated+signed"; exit 1; }
              [ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(gh api "$ref" --jq .object.sha)" --jq .verification.verified)" = true ] \
                || { echo "::error::release tag signature not verified by GitHub"; exit 1; } ;;
            refs/heads/main) t=edge ;;
            *) t="test-${GITHUB_SHA::7}" ;;
          esac
          echo "tag=$t" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: builder-a, path: art/builder }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: runner-a, path: art/runner }
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with: { cosign-release: v2.6.5 }
      - run: scripts/install-sign-tools.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: push
        name: push, sign, attest
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          EXPECT_builder: ${{ needs.builder-compare.outputs.digest }}
          EXPECT_runner: ${{ needs.runner-compare.outputs.digest }}
          BUILDER_ID: ${{ github.server_url }}/${{ github.workflow_ref }}
          SOURCE_URI: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          for img in builder runner; do
            exp="EXPECT_$img"
            ref="$(scripts/publish-image.sh "$img" "art/$img/$img.tar" "$TAG" "${!exp}")"
            scripts/sign-image.sh "$ref" "art/$img/$img.tar"
            echo "$img=$ref" >> "$GITHUB_OUTPUT"
          done

  verify:
    name: verify (fresh runner)
    needs: publish
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with: { cosign-release: v2.6.5 }
      - name: verify signature, SBOM, provenance
        env:
          TOKEN: ${{ github.token }}
          BUILDER: ${{ needs.publish.outputs.builder }}
          RUNNER: ${{ needs.publish.outputs.runner }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for ref in "$BUILDER" "$RUNNER"; do scripts/verify-release.sh "$ref"; done
