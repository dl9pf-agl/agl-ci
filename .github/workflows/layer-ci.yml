name: layer-ci
# Reusable CI for the AGL layer repos. Callers pin this file by full SHA. Logic lives in ci/ (engine) of this repo,
# fetched at the same SHA. See docs/manual/13-layer-ci-engine.md.
on:
  workflow_call:
    inputs:
      repo:
        description: 'Repo under test (meta-agl | meta-agl-demo | meta-agl-devel | agl-ucb); scopes the downstream chain; empty = the calling repo'
        type: string
        default: ''
      tier:
        description: 'push-pr | nightly | release | dispatch; empty = derive from the calling event'
        type: string
        default: ''
      ucb_ref:
        description: 'agl-ucb branch/tag/SHA to build with; empty = default branch'
        type: string
        default: ''
      kas_exec:
        description: 'kas-container (signed builder image) | kas (inside the runner image)'
        type: string
        default: kas-container
      mode:
        description: 'build (validate + build) | drill (outage drill, network off) | drill-mirror (fetch from the mirror alone) | fetch (fill the download cache); chapter 15'
        type: string
        default: build

permissions: {}

concurrency:
  group: layer-ci-${{ inputs.repo || github.event.repository.name }}-${{ inputs.mode || github.event.inputs.mode }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # repo under test, pinned over agl-ucb's branch by kas (ci/scripts/_kas_runtime_args.sh): the PR head
  # (fork URL for fork PRs) or this repo at the pushed commit
  AGL_PIN_REPO: ${{ inputs.repo || github.event.repository.name }}
  AGL_PIN_URL: https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
  AGL_PIN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  matrix:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      tier: ${{ steps.gen.outputs.tier }}
      mode: ${{ steps.gen.outputs.mode }}
      pool: ${{ steps.gen.outputs.pool }}
      builder: ${{ steps.gen.outputs.builder }}
      count: ${{ steps.gen.outputs.count }}
      nightly_date: ${{ steps.gen.outputs.nightly_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: agl-ci
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agl-ucb
          ref: ${{ inputs.ucb_ref }}
          path: tree
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with: { cosign-release: v2.6.5 }
      - id: gen
        env:
          REPO: ${{ inputs.repo || github.event.repository.name }}
          TIER_IN: ${{ inputs.tier || github.event.inputs.tier }}
          MODE_IN: ${{ inputs.mode || github.event.inputs.mode }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TIER: ${{ github.event.inputs.tier }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tier="$TIER_IN"
          if [ -z "$tier" ]; then
            case "$EVENT" in
              pull_request|push) tier=push-pr ;;
              schedule) tier=nightly ;;
              release) tier=release ;;
              *) tier="${DISPATCH_TIER:-dispatch}" ;;
            esac
          fi
          # A pull request can edit its own caller file and pass any tier: it always builds push-pr
          [ "$EVENT" != pull_request ] || tier=push-pr
          # same for the mode: a pull request must not swap validate + build for a drill and still get a green result
          mode="$MODE_IN"; [ "$EVENT" != pull_request ] || mode=build
          case "$mode" in build|drill|drill-mirror|fetch) ;; *) echo "mode must be build, drill, drill-mirror or fetch" >&2; exit 1 ;; esac
          # Pool: a pull request from another repo (or from a deleted one) runs on an untrusted host, everything else on a trusted
          # one. Decided here from the event, never from the caller's inputs. See docs/manual/05-runner-setup.md, Pools.
          pool=agl-pr; [ "$EVENT" != pull_request ] || [ "$HEAD_REPO" = "$THIS_REPO" ] || pool=agl-fork
          builder="ghcr.io/${GITHUB_REPOSITORY_OWNER}/agl-ci/builder@$(tr -d '[:space:]' < agl-ci/ci/builder.digest)"
          agl-ci/scripts/verify-release.sh "$builder"
          # kas clones the layers (repo under test pinned); the matrices live in them
          # run kas from the verified builder image itself
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" -e HOME=/tmp \
            -e AGL_TREE="$PWD/tree" -e KAS_EXEC=kas -e CI=true \
            -e AGL_PIN_REPO -e AGL_PIN_URL -e AGL_PIN_SHA \
            --entrypoint /bin/bash "$builder" agl-ci/ci/scripts/checkout.sh
          # The repo under test must be at the commit under test. A pin in agl-ucb once hid the pull request (the run was green and
          # built nothing); this makes that failure loud.
          if [ -e "tree/$REPO/.git" ]; then
            got="$(git -C "tree/$REPO" rev-parse HEAD)"
            [ "$got" = "$AGL_PIN_SHA" ] || { echo "::error::tree/$REPO is at $got, not at the commit under test $AGL_PIN_SHA"; exit 1; }
          fi
          {
            echo "tier=$tier"
            echo "mode=$mode"
            echo "pool=$pool"
            echo "builder=$builder"
            json="$(AGL_TREE=$PWD/tree AGL_SCOPE=$REPO python3 agl-ci/ci/scripts/_matrix.py --json "$tier")"
            echo "matrix=$json"
            echo "count=$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$json")"
            # One date-time key per run, shared by every matrix job of this run (nightly-collect.sh/nightly-finalize.sh), so
            # all of this run's images land in the same dated folder on the download server.
            echo "nightly_date=$(date -u +%Y-%m-%d-%H%M)"
          } >> "$GITHUB_OUTPUT"
          # What this run resolved to, in the format of kas/pins.yml: meta-agl, meta-agl-demo and meta-agl-devel float on their
          # branch, so this is their written-out pin (a release stores it, chapter 13).
          if docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" -e HOME=/tmp \
              -e AGL_TREE="$PWD/tree" -e KAS_EXEC=kas -e CI=true -e AGL_PIN_REPO -e AGL_PIN_URL -e AGL_PIN_SHA \
              --entrypoint /bin/bash "$builder" agl-ci/ci/scripts/resolved-pins.sh > resolved-pins.yml; then
            { echo "### Resolved pins of this run"; echo '```yaml'; cat resolved-pins.yml; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not write out the resolved pins of this run"
          fi
          if grep -qx 'count=0' "$GITHUB_OUTPUT"; then
            echo "::warning::the matrix of tier $tier is empty for $REPO: nothing will be built and the result is green"
          fi

  # DISABLED (2026-11-19): second approval gate for fork PRs, via the environment `agl-ci-build` (required reviewers,
  # configured per repo: scripts/github-settings.sh). GitHub's own gate (approval policy `all_external_contributors`: a
  # maintainer clicks "Approve and run workflows") is enough for now and the two gates asked the same person twice.
  # To enable it again: uncomment this job, put `approve` back into `needs:` of build, check-layer and result, and put
  # `&& (needs.approve.result == 'success' || needs.approve.result == 'skipped')` back into the `if:` of build and check-layer.
  # approve:
  #   needs: matrix
  #   if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
  #   runs-on: ubuntu-24.04
  #   permissions: {}
  #   environment: agl-ci-build
  #   steps:
  #     - run: echo "approved"

  build:
    name: build (${{ matrix.repo }}/${{ matrix.target }} on ${{ matrix.machine }})
    needs: [matrix]
    # !cancelled(), not always(): a job with always() is never cancelled by GitHub (cancel lab 2026-11-19, manual chapter 13). Same for check-layer.
    if: ${{ !cancelled() && needs.matrix.result == 'success' && needs.matrix.outputs.count != '0' }}
    runs-on: [self-hosted, "${{ needs.matrix.outputs.pool }}"]
    timeout-minutes: 2880   # 48 h: a cold build of a Qt or Flutter demo image needs about 22 h alone and more beside another cold build (10 h and 24 h were too short or too tight); a re-run resumes from the sstate
    permissions: { contents: read }
    strategy:
      fail-fast: false
      max-parallel: ${{ needs.matrix.outputs.mode == 'fetch' && 3 || 256 }}   # the fill clones from GitHub and others: three at a time, builds are not capped
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      CI: "true"
      AGL_TREE: ${{ github.workspace }}/tree
      AGL_SCOPE: ${{ inputs.repo || github.event.repository.name }}
      KAS_EXEC: ${{ inputs.kas_exec }}
      KAS_CONTAINER_IMAGE: ${{ needs.matrix.outputs.builder }}
      # Nightly only, for now: the trowl scan (AGL_TROWL: kas/feature/trowl.yml, runs inside the bitbake build), the vulnscout
      # scan (AGL_VULNSCOUT: step `scan (vulnscout)` below) and the collect-into-nightly-staging step (step `collect`). All
      # three are ready for push-pr too, this just doesn't flip the flags there yet. The scans are report-only (manual chapter 13).
      AGL_TROWL: ${{ needs.matrix.outputs.tier == 'nightly' && '1' || '' }}
      AGL_VULNSCOUT: ${{ needs.matrix.outputs.tier == 'nightly' && '1' || '' }}
      AGL_NIGHTLY: ${{ needs.matrix.outputs.tier == 'nightly' && '1' || '' }}
      NIGHTLY_DATE: ${{ needs.matrix.outputs.nightly_date }}
      NIGHTLY_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: agl-ci
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agl-ucb
          ref: ${{ inputs.ucb_ref }}
          path: tree
          persist-credentials: false
      - name: layers
        run: agl-ci/ci/scripts/checkout.sh
      - name: drill
        if: needs.matrix.outputs.mode == 'drill' || needs.matrix.outputs.mode == 'drill-mirror'
        env:
          MACHINE: ${{ matrix.machine }}
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
          DRILL_MODE: ${{ needs.matrix.outputs.mode == 'drill-mirror' && 'mirror' || 'fetchall' }}
          # the mirror to test is a repository variable that only maintainers can set, not an input of the dispatch
          AGL_MIRROR_URL: ${{ vars.AGL_MIRROR_URL }}
        run: agl-ci/ci/scripts/drill.sh --machine "$MACHINE" --features "$FEATURES" --target "$TARGET" --mode "$DRILL_MODE"
      - name: fetch
        if: needs.matrix.outputs.mode == 'fetch'
        env:
          MACHINE: ${{ matrix.machine }}
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
        run: agl-ci/ci/scripts/fetch.sh --machine "$MACHINE" --features "$FEATURES" --target "$TARGET"
      - name: validate
        if: needs.matrix.outputs.mode == 'build'
        env:
          MACHINE: ${{ matrix.machine }}
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
        # --verbose: output of every check in the job log (collapsible groups), durations, summary. Delete the flag to quiet it.
        run: agl-ci/ci/scripts/validate.sh --machine "$MACHINE" --features "$FEATURES" --target "$TARGET" --verbose
      - name: build
        if: needs.matrix.outputs.mode == 'build'
        env:
          MACHINE: ${{ matrix.machine }}
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
          SDK_ALLOWED: ${{ needs.matrix.outputs.tier == 'release' && 'true' || 'false' }}
        run: agl-ci/ci/scripts/build.sh --machine "$MACHINE" --features "$FEATURES" --target "$TARGET" --sdk-allowed "$SDK_ALLOWED"
      # The next two steps run on the runner, after the build and outside of kas-container: vulnscout needs docker, which the
      # builder container never gets. They run in this order because the collect step takes the reports with it.
      - name: scan (vulnscout)
        if: needs.matrix.outputs.mode == 'build' && env.AGL_VULNSCOUT == '1'
        continue-on-error: true   # a scan never fails the job: we want every report (manual chapter 13)
        env:
          MACHINE: ${{ matrix.machine }}
          TARGET: ${{ matrix.target }}
        run: agl-ci/ci/scripts/vulnscout-scan.sh --deploy-dir "$AGL_TREE/build/tmp/deploy/images/$MACHINE" --target "$TARGET" --machine "$MACHINE"
      - name: collect
        if: needs.matrix.outputs.mode == 'build' && env.AGL_NIGHTLY == '1'
        env:
          IMAGE_REPO: ${{ matrix.repo }}   # the repo that owns the image: its folder in the nightly
          MACHINE: ${{ matrix.machine }}
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
        run: agl-ci/ci/scripts/collect.sh --machine "$MACHINE" --features "$FEATURES" --target "$TARGET"
      # Artifact upload is OFF (2026-11-18): images and result directories cost about 230 GB of Actions storage in 18 days. build.sh does not
      # copy the images any more either. To revive, remove the '# ' prefix of this step and of the copy in ci/scripts/build.sh (chapter 13).
      # - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      #   if: always()
      #   with:
      #     name: ${{ matrix.repo }}-${{ matrix.machine }}-${{ matrix.target }}
      #     path: |
      #       tree/build/artifacts/**
      #       tree/build/validate-results/**
      #       tree/build/drill-results/**
      #       tree/build/fetch-results/**
      #     retention-days: ${{ needs.matrix.outputs.tier == 'push-pr' && 7 || needs.matrix.outputs.tier == 'nightly' && 7 || 90 }}

  # yocto-check-layer runs against a bare oe-core config, not against the image, so it does not depend on a matrix entry: one run
  # per workflow run, next to the build jobs, instead of once per image inside each of them (about 13 minutes each).
  check-layer:
    needs: [matrix]
    if: ${{ !cancelled() && needs.matrix.result == 'success' && needs.matrix.outputs.count != '0' && needs.matrix.outputs.mode == 'build' }}
    runs-on: [self-hosted, "${{ needs.matrix.outputs.pool }}"]
    timeout-minutes: 120
    permissions: { contents: read }
    env:
      CI: "true"
      AGL_TREE: ${{ github.workspace }}/tree
      AGL_SCOPE: ${{ inputs.repo || github.event.repository.name }}
      KAS_EXEC: ${{ inputs.kas_exec }}
      KAS_CONTAINER_IMAGE: ${{ needs.matrix.outputs.builder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: agl-ci
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agl-ucb
          ref: ${{ inputs.ucb_ref }}
          path: tree
          persist-credentials: false
      - name: layers
        run: agl-ci/ci/scripts/checkout.sh
      - name: yocto-check-layer
        run: agl-ci/ci/scripts/check-layer.sh

  # Mark the nightly complete (<date>/COMPLETE) once every build job of the run is done (nightly-finalize.sh); each image is
  # public already, since its own collect step. Same arrangement as release.yml's finalize job: it must
  # run as root in a container on the sidecar's Docker daemon, because this job cannot enter the cache directory itself.
  nightly-finalize:
    needs: [matrix, build]
    if: ${{ !cancelled() && needs.matrix.outputs.tier == 'nightly' && needs.matrix.outputs.count != '0' && needs.build.result == 'success' }}
    runs-on: [self-hosted, "${{ needs.matrix.outputs.pool }}"]
    permissions: { contents: read }
    env:
      KAS_CONTAINER_IMAGE: ${{ needs.matrix.outputs.builder }}
      NIGHTLY_DATE: ${{ needs.matrix.outputs.nightly_date }}
      NIGHTLY_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: agl-ci
          persist-credentials: false
      - name: finalize
        run: |
          set -euo pipefail
          engine="$PWD/agl-ci/ci/scripts"
          nightly="${NIGHTLY_STAGING:-$(dirname "${AGL_SSTATE_DIR:?AGL_SSTATE_DIR is not set: this host has no cache directory}")/nightly}"
          docker run --rm --user 0 \
            -v "$engine:$engine:ro" -v "$nightly:$nightly" \
            -e NIGHTLY_STAGING="$nightly" -e NIGHTLY_DATE -e NIGHTLY_RUN_ID \
            --entrypoint /bin/bash "$KAS_CONTAINER_IMAGE" "$engine/nightly-finalize.sh"

  # The only required status check of a caller repo.
  result:
    needs: [matrix, build, check-layer, nightly-finalize]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then echo "::error::a job failed or was cancelled"; exit 1; fi
