name: layer-ci
# Reusable CI for the AGL layer repos. Callers pin this file by full SHA. Logic lives in ci/ (engine) of this repo,
# fetched at the same SHA. See docs/manual/13-layer-ci-engine.md.
on:
  workflow_call:
    inputs:
      repo:
        description: 'Repo under test (meta-agl | meta-agl-demo | meta-agl-devel | agl-ucb); scopes the downstream chain; empty = the calling repo'
        type: string
        default: ''
      tier:
        description: 'push-pr | nightly | release | dispatch; empty = derive from the calling event'
        type: string
        default: ''
      ucb_ref:
        description: 'agl-ucb branch/tag/SHA to build with; empty = default branch'
        type: string
        default: ''
      kas_exec:
        description: 'kas-container (signed builder image) | kas (inside the runner image)'
        type: string
        default: kas-container
      mode:
        description: 'build (validate + build) | drill (outage drill, network off) | drill-mirror (fetch from the mirror alone) | fetch (fill the download cache); chapter 15'
        type: string
        default: build

permissions: {}

concurrency:
  group: layer-ci-${{ inputs.repo || github.event.repository.name }}-${{ inputs.mode || github.event.inputs.mode }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # repo under test, pinned over agl-ucb's branch by kas (ci/scripts/_kas_runtime_args.sh): the PR head
  # (fork URL for fork PRs) or this repo at the pushed commit
  AGL_PIN_REPO: ${{ inputs.repo || github.event.repository.name }}
  AGL_PIN_URL: https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
  AGL_PIN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  matrix:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      tier: ${{ steps.gen.outputs.tier }}
      mode: ${{ steps.gen.outputs.mode }}
      pool: ${{ steps.gen.outputs.pool }}
      builder: ${{ steps.gen.outputs.builder }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: agl-ci
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agl-ucb
          ref: ${{ inputs.ucb_ref }}
          path: tree
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v2.6.5 }
      - id: gen
        env:
          REPO: ${{ inputs.repo || github.event.repository.name }}
          TIER_IN: ${{ inputs.tier || github.event.inputs.tier }}
          MODE_IN: ${{ inputs.mode || github.event.inputs.mode }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TIER: ${{ github.event.inputs.tier }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tier="$TIER_IN"
          if [ -z "$tier" ]; then
            case "$EVENT" in
              pull_request|push) tier=push-pr ;;
              schedule) tier=nightly ;;
              release) tier=release ;;
              *) tier="${DISPATCH_TIER:-dispatch}" ;;
            esac
          fi
          # A pull request can edit its own caller file and pass any tier: it always builds push-pr
          [ "$EVENT" != pull_request ] || tier=push-pr
          # same for the mode: a pull request must not swap validate + build for a drill and still get a green result
          mode="$MODE_IN"; [ "$EVENT" != pull_request ] || mode=build
          case "$mode" in build|drill|drill-mirror|fetch) ;; *) echo "mode must be build, drill, drill-mirror or fetch" >&2; exit 1 ;; esac
          # Pool: a pull request from another repo (or from a deleted one) runs on an untrusted host, everything else on a trusted
          # one. Decided here from the event, never from the caller's inputs. See docs/manual/05-runner-setup.md, Pools.
          pool=agl-pr; [ "$EVENT" != pull_request ] || [ "$HEAD_REPO" = "$THIS_REPO" ] || pool=agl-fork
          builder="ghcr.io/${GITHUB_REPOSITORY_OWNER}/agl-ci/builder@$(tr -d '[:space:]' < agl-ci/ci/builder.digest)"
          agl-ci/scripts/verify-release.sh "$builder"
          # kas clones the layers (repo under test pinned); the matrices live in them
          # run kas from the verified builder image itself
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" -e HOME=/tmp \
            -e AGL_TREE="$PWD/tree" -e KAS_EXEC=kas -e CI=true \
            -e AGL_PIN_REPO -e AGL_PIN_URL -e AGL_PIN_SHA \
            --entrypoint /bin/bash "$builder" agl-ci/ci/scripts/checkout.sh
          # The repo under test must be at the commit under test. A pin in agl-ucb once hid the pull request (the run was green and
          # built nothing); this makes that failure loud.
          if [ -e "tree/$REPO/.git" ]; then
            got="$(git -C "tree/$REPO" rev-parse HEAD)"
            [ "$got" = "$AGL_PIN_SHA" ] || { echo "::error::tree/$REPO is at $got, not at the commit under test $AGL_PIN_SHA"; exit 1; }
          fi
          {
            echo "tier=$tier"
            echo "mode=$mode"
            echo "pool=$pool"
            echo "builder=$builder"
            json="$(AGL_TREE=$PWD/tree AGL_SCOPE=$REPO python3 agl-ci/ci/scripts/_matrix.py --json "$tier")"
            echo "matrix=$json"
            echo "count=$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$json")"
          } >> "$GITHUB_OUTPUT"
          # What this run resolved to, in the format of kas/pins.yml: meta-agl, meta-agl-demo and meta-agl-devel float on their
          # branch, so this is their written-out pin (a release stores it, chapter 13).
          if docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" -e HOME=/tmp \
              -e AGL_TREE="$PWD/tree" -e KAS_EXEC=kas -e CI=true -e AGL_PIN_REPO -e AGL_PIN_URL -e AGL_PIN_SHA \
              --entrypoint /bin/bash "$builder" agl-ci/ci/scripts/resolved-pins.sh > resolved-pins.yml; then
            { echo "### Resolved pins of this run"; echo '```yaml'; cat resolved-pins.yml; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not write out the resolved pins of this run"
          fi
          if grep -qx 'count=0' "$GITHUB_OUTPUT"; then
            echo "::warning::the matrix of tier $tier is empty for $REPO: nothing will be built and the result is green"
          fi

  # Fork PRs execute contributor code on the self-hosted runner: a maintainer approves via the
  # environment `agl-ci-build` (required reviewers, configured per repo: scripts/github-settings.sh).
  approve:
    needs: matrix
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    permissions: {}
    environment: agl-ci-build
    steps:
      - run: echo "approved"

  build:
    name: build (${{ matrix.repo }}/${{ matrix.target }} on ${{ matrix.machine }})
    needs: [matrix, approve]
    if: always() && needs.matrix.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped') && needs.matrix.outputs.count != '0'
    runs-on: [self-hosted, "${{ needs.matrix.outputs.pool }}"]
    timeout-minutes: 1440   # a cold build of a Qt or Flutter demo image does not fit in 10 h (two ran into the old limit); a re-run resumes from the sstate
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      CI: "true"
      AGL_TREE: ${{ github.workspace }}/tree
      AGL_SCOPE: ${{ inputs.repo || github.event.repository.name }}
      KAS_EXEC: ${{ inputs.kas_exec }}
      KAS_CONTAINER_IMAGE: ${{ needs.matrix.outputs.builder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: agl-ci
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agl-ucb
          ref: ${{ inputs.ucb_ref }}
          path: tree
          persist-credentials: false
      - name: layers
        run: agl-ci/ci/scripts/checkout.sh
      - name: drill
        if: needs.matrix.outputs.mode == 'drill' || needs.matrix.outputs.mode == 'drill-mirror'
        env:
          MACHINE: ${{ matrix.machine }}
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
          DRILL_MODE: ${{ needs.matrix.outputs.mode == 'drill-mirror' && 'mirror' || 'fetchall' }}
          # the mirror to test is a repository variable that only maintainers can set, not an input of the dispatch
          AGL_MIRROR_URL: ${{ vars.AGL_MIRROR_URL }}
        run: agl-ci/ci/scripts/drill.sh --machine "$MACHINE" --features "$FEATURES" --target "$TARGET" --mode "$DRILL_MODE"
      - name: fetch
        if: needs.matrix.outputs.mode == 'fetch'
        env:
          MACHINE: ${{ matrix.machine }}
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
        run: agl-ci/ci/scripts/fetch.sh --machine "$MACHINE" --features "$FEATURES" --target "$TARGET"
      - name: validate
        if: needs.matrix.outputs.mode == 'build'
        env:
          MACHINE: ${{ matrix.machine }}
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
        run: agl-ci/ci/scripts/validate.sh --machine "$MACHINE" --features "$FEATURES" --target "$TARGET"
      - name: build
        if: needs.matrix.outputs.mode == 'build'
        env:
          MACHINE: ${{ matrix.machine }}
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
          SDK_ALLOWED: ${{ needs.matrix.outputs.tier == 'release' && 'true' || 'false' }}
        run: agl-ci/ci/scripts/build.sh --machine "$MACHINE" --features "$FEATURES" --target "$TARGET" --sdk-allowed "$SDK_ALLOWED"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.repo }}-${{ matrix.machine }}-${{ matrix.target }}
          path: |
            tree/build/artifacts/**
            tree/build/validate-results/**
            tree/build/drill-results/**
            tree/build/fetch-results/**
          retention-days: ${{ needs.matrix.outputs.tier == 'push-pr' && 7 || needs.matrix.outputs.tier == 'nightly' && 30 || 90 }}

  # The only required status check of a caller repo.
  result:
    needs: [matrix, approve, build]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then echo "::error::a job failed or was cancelled"; exit 1; fi
