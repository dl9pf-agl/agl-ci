header:
  version: 23

# Source mirror fill (ci/scripts/fetch.sh): write a tarball for every git source into DL_DIR, so that DL_DIR can be
# published as a PREMIRROR. Not part of any hash. Only the fetch job uses it; a normal build does not need it.
local_conf_header:
  ci-mirror: |
    BB_GENERATE_MIRROR_TARBALLS = "1"
