# Build nodes (agl-ci chapter 05, "Build node tuning"): keep written data and file metadata in RAM as long as is sensible.
# NOT for the cache/mirror/hash server host: there the data is the source of truth and a long dirty window is a risk.
#   sudo install -m 0644 kit/sysctl/90-agl-ci-cache.conf /etc/sysctl.d/ && sudo sysctl --system

# swap only when free and file-backed pages are nearly gone
vm.swappiness = 1
# keep dentries and inodes (Yocto: millions of small files) four times longer than the default 100; 0 would risk out-of-memory
vm.vfs_cache_pressure = 25
# percent of AVAILABLE memory (free + reclaimable): the flusher starts at 40, writers block at 80
vm.dirty_background_ratio = 40
vm.dirty_ratio = 80
# dirty data may stay 5 minutes (usual default 30 s); the flusher wakes every 30 s (usual default 5 s). Builds delete most of their
# temporary files before they are ever written. Data that a program flushes with fsync is not affected.
vm.dirty_expire_centisecs = 30000
vm.dirty_writeback_centisecs = 3000
