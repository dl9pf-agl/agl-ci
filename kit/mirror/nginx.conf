# Read-only mirror of the trusted cache: /dl and /sstate, nothing else. Runs unprivileged (nginxinc/nginx-unprivileged).
worker_processes auto;
pid /tmp/nginx.pid;
events {}
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  sendfile on;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /srv/mirror;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # never served: locks, partial downloads, done stamps, hash equivalence database, git clone directories, dotfiles
    location ~* (\.lock|\.tmp|\.done)$ { return 404; }
    location ~* /hashserv\.db { return 404; }
    location ^~ /dl/git2/ { return 404; }
    location ~ /\. { return 404; }

    location /dl/ { }
    location /sstate/ { }
    location / { return 404; }
  }
}
