# TLS server of the mirror, mounted by run.sh when TLS_CERT and TLS_KEY are given. The certificate and key are mounted read-only
# at /etc/nginx/mirror/cert/. Same rules as the plain server (locations.conf).
server {
  listen 8443 ssl;
  ssl_certificate     /etc/nginx/mirror/cert/fullchain.pem;
  ssl_certificate_key /etc/nginx/mirror/cert/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:mirror:1m;
  include /etc/nginx/mirror/locations.conf;
}
