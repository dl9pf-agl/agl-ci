# SPDX-License-Identifier: MIT
# Read-only rsync daemon that publishes the cache of a TRUSTED build host to the download server (chapter 15). Mounted by
# rsyncd.sh, never edited on the host. No account, no password: access control is the network (the private address the
# container is bound to) plus "hosts allow". Everything is read-only three times over: read-only mounts, "read only = yes", and
# a daemon that drops to an unprivileged uid before it touches a file.
pid file = /tmp/rsyncd.pid
lock file = /tmp/rsyncd.lock
use chroot = yes
uid = 1001
gid = 1001
max connections = 4
timeout = 600
# "hosts allow" is put in front of this file by rsyncd.sh (RSYNCD_ALLOW). With it set and no "hosts deny", every other host is
# refused. (An &include of the address did not take effect in rsync 3.5: tested, so the file is assembled instead.)

[agl]
path = /srv/agl
comment = AGL CI cache (read-only)
read only = yes
write only = no
list = yes
numeric ids = yes
# never offered, whatever the client asks for: locks, partial downloads, done stamps, the hash equivalence database, dotfiles,
# and the git clone directories (the git2_*.tar.gz files are offered)
exclude = *.lock *.tmp *.done hashserv.db* .* /dl/git2/
# nothing can be changed or deleted through this module
refuse options = delete* remove-* sparse
