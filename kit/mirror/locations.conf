# SPDX-License-Identifier: MIT
# The rules of the mirror, shared by the plain HTTP server and the optional TLS server (nginx.conf, tls-server.conf).
root /srv/mirror;
autoindex off;
add_header X-Content-Type-Options nosniff always;

if ($request_method !~ ^(GET|HEAD)$) { return 405; }

# never served: locks, partial downloads, done stamps, hash equivalence database, git clone directories, dotfiles
location ~* (\.lock|\.tmp|\.done)$ { return 404; }
location ~* /hashserv\.db { return 404; }
location ^~ /dl/git2/ { return 404; }
location ~ /\. { return 404; }

location /dl/ { }
location /sstate/ { }
location /git/ { }   # bare mirrors of the layer repositories for kas (git-mirrors.sh), dumb HTTP, read-only
location / { return 404; }
