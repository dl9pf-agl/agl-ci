# The rules of the mirror, shared by the plain HTTP server and the optional TLS server (nginx.conf, tls-server.conf).
root /srv/mirror;
autoindex off;
add_header X-Content-Type-Options nosniff always;

if ($request_method !~ ^(GET|HEAD)$) { return 405; }

# never served: locks, partial downloads, done stamps, hash equivalence database, git clone directories, dotfiles
location ~* (\.lock|\.tmp|\.done)$ { return 404; }
location ~* /hashserv\.db { return 404; }
location ^~ /dl/git2/ { return 404; }
location ~ /\. { return 404; }

location /dl/ { }
location /sstate/ { }
location /git/ { log_not_found off; }   # bare mirrors of the layer repositories for kas (git-mirrors.sh), dumb HTTP, read-only; most 404s here are likely git's loose-object probes (not confirmed)
# release files (kit/release/promote.sh): staging/release/<branch>/<version>/ = pulled from the builder, NOT verified yet;
# release/<branch>/<version>/ = verified (CI and engineer signatures) and promoted. Both browsable.
location /staging/ { autoindex on; }
location /release/ { autoindex on; }
# the top level is a small static page (index.html) that links the folders meant for people; the build caches (dl, sstate, git) are
# not listed and have no index. try_files serves the file here itself, so /index.html stays a 404 (location / below).
location = / { try_files /index.html =404; }
location / { return 404; }
